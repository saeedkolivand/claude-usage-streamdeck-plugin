name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build plugin bundle
        run: npm run build

      - name: Validate manifest
        run: npx streamdeck validate com.saeedkolivand.claude-usage.sdPlugin

      - name: Package plugin
        run: npx streamdeck pack com.saeedkolivand.claude-usage.sdPlugin --output dist --force

      - name: Upload packaged plugin
        uses: actions/upload-artifact@v7
        with:
          name: streamdeck-plugin
          path: dist/com.saeedkolivand.claude-usage.streamDeckPlugin
          if-no-files-found: error
